services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: movielens-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    mem_limit: 768m
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: movielens-elasticsearch
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    mem_limit: 1g
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: movielens-kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    mem_limit: 768m
    restart: unless-stopped

  spark:
    image: apache/spark:3.5.9-scala2.12-java17-python3-ubuntu
    container_name: movielens-spark
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8080:8080"
    environment:
      SPARK_MASTER_HOST: spark
      SPARK_MASTER_PORT: 7077
    volumes:
      - ./data/raw:/data/raw:ro
      - ./data/processed:/data/processed
      - ./src/spark:/opt/spark-jobs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    mem_limit: 768m
    restart: unless-stopped

  spark-worker:
    image: apache/spark:3.5.9-scala2.12-java17-python3-ubuntu
    container_name: movielens-spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark:7077
    environment:
      SPARK_WORKER_MEMORY: 1G
      SPARK_WORKER_CORES: 2
      HOME: /tmp
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_RAW_RATINGS: raw_ratings
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: "9200"
      DATA_RAW_PATH: /data/raw
    depends_on:
      spark:
        condition: service_healthy
    volumes:
      - ./data/raw:/data/raw:ro
      - ./data/processed:/data/processed
      - ./src/spark:/opt/spark-jobs
    mem_limit: 1536m
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: movielens-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s
    mem_limit: 4g
    restart: unless-stopped

  app:
    build: .
    container_name: movielens-app
    env_file:
      - .env
    ports:
      - "8501:8501"
    volumes:
      - ./data/raw:/data/raw:ro
      - ./data/processed:/data/processed
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./tests:/app/tests
      - ./kibana:/app/kibana
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      ollama:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

volumes:
  kafka_data:
  es_data:
  ollama_data:
